name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment & Licenses
- name: Setup Android SDK Environment & Licenses
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo "84831b9409646a914e3056144cf2f1507d7b1d4a" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

    - name: Build Debug APK with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '7.5'
        arguments: assembleDebug
        cache-disabled: true

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
